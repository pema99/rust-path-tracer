[package]
name = "rustic"
version = "0.1.0"
authors = ["Pema Malling <pemamalling@gmail.com>"]
edition = "2021"

[dependencies]
shared_structs = { path = "shared_structs" }
kernels = { path = "kernels" }
bytemuck = { version = "1.13.1", features = ["derive"] }
glam = { version = "0.33.5", features = ["bytemuck"] }
rand = "0.10.2"
oidn = { version = "2.5.1", optional = true }
lazy_static = "1.4.0"
russimp = { version = "3.2.1", features = ["prebuilt"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "tga", "exr"] }
parking_lot = "0.12.1"
winit = "0.30.13"
wgpu = { version = "30.0.1", features = ["spirv"] }
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
egui = "0.36.1"
egui_plot = "0.37.0"
pollster = "1.0.1"
tinyfiledialogs = "3.9.1"
fast_image_resize = "6.1.0"
rayon = "1.7.0"

[build-dependencies]
spirv-builder = "0.10.0-alpha.1"

[features]
oidn = ["dep:oidn"]

[profile.release.build-override]
opt-level = 3
codegen-units = 16

[profile.dev.build-override]
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false